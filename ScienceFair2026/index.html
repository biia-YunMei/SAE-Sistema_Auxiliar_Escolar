<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAE — Entrar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center min-vh-100">
  <main class="container" style="max-width:460px">
    <section class="card shadow-sm"><div class="card-body p-4">
      <h1 class="h3 mb-2">SAE</h1><p class="text-secondary">Sistema Auxiliar Escolar</p>
      <form id="loginForm"><div class="mb-3"><label class="form-label">WhatsApp</label><input id="phone" class="form-control" placeholder="(11) 91234-5678 ou +5566999999999" required></div>
      <div class="mb-3"><label class="form-label">Senha</label><input id="password" type="password" class="form-control" autocomplete="current-password"></div>
      <button class="btn btn-teal w-100">Entrar</button></form>
      <p id="loginError" class="text-danger small mt-3 mb-0"></p>
    </div></section>
    <p class="text-center text-secondary small mt-3 mb-0">SAE — criado pela equipe da Feira de Ciências 2026 · <a href="status.html" class="text-secondary">status ao vivo</a></p>
  </main>
  <script src="js/api.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm')
    const phoneInput = document.getElementById('phone')
    const passwordInput = document.getElementById('password')
    const loginError = document.getElementById('loginError')
    const loginButton = loginForm.querySelector('button[type="submit"], button:not([type])')
    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault()
      loginError.textContent = ''
      loginButton.disabled = true
      try {
        const user = await saeLogin(phoneInput.value.trim(), passwordInput.value)
        const page = user.type === 'PROF' ? 'professores.html' : 'coordenacao.html'
        window.location.href = `${page}?sae_token=${encodeURIComponent(user.token)}`
      }
      catch (e) { loginError.textContent = e.message }
      finally { loginButton.disabled = false }
    })
  </script>
</body></html>
