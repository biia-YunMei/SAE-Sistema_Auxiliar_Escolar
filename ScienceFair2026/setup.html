<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Setup Inicial - SAE</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .setup-wrapper {
        width: 100%;
        padding: 1.5rem;
      }

      .setup-card {
        max-width: 450px;
        margin: 0 auto;
      }

      .setup-icon {
        font-size: 3rem;
        color: var(--teal-600);
        margin-bottom: 1.5rem;
        text-align: center;
      }

      [data-bs-theme='dark'] .setup-icon {
        color: var(--teal-400);
      }

      .setup-title {
        text-align: center;
        font-weight: 700;
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
        color: var(--bs-body-color);
      }

      .setup-description {
        text-align: center;
        color: var(--bs-secondary-color);
        margin-bottom: 2rem;
        font-size: 0.95rem;
      }

      .btn-setup {
        padding: 0.75rem 1.5rem;
        font-weight: 600;
        font-size: 1rem;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="setup-wrapper">
      <div class="card setup-card">
        <div class="card-body p-5">
          <div class="setup-icon"></div>
          <h1 class="setup-title">Bem-vindo ao SAE</h1>
          <p class="setup-description">
            Configure seu primeiro usuário administrador para começar a usar o
            sistema de gerenciamento escolar.
          </p>
          <button class="btn btn-teal btn-setup" id="btnSetup">
            <i class="bi bi-plus-circle"></i> Criar Administrador
          </button>
        </div>
      </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/api.js"></script>
    <script>
      document
        .getElementById('btnSetup')
        .addEventListener('click', function () {
          window.location.href = 'admin-register.html'
        })
    </script>
  </body>
</html>
